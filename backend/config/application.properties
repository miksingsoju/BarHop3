server.port = 8080
spring.main.allow-bean-definition-overriding=true

# ---- MySQL ----
# The barhop_db database is created automatically on first run.
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/barhop_db?createDatabaseIfNotExist=true&serverTimezone=Asia/Manila&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL57Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show_sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Manila
# Entity constraints are documentation; requests are validated on the DTOs instead
# (otherwise closing out past reservations would fail @FutureOrPresent-style checks on update).
spring.jpa.properties.javax.persistence.validation.mode=none

# ---- JSON ----
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.generator.write-bigdecimal-as-plain=true
spring.jackson.time-zone=Asia/Manila
spring.jackson.deserialization.fail-on-unknown-properties=false

# ---- Demo data (only loads into an empty database) ----
barhop.seed=true

